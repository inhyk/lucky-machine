<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>꽝 없는 뽑기 기계</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background: #0a0a14; color: #e0dce8;
        }
        body { filter: grayscale(100%); transition: filter 2s ease; }

        /* ===== SCENE SYSTEM ===== */
        .scene {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 1.2s ease; z-index: 1;
            padding: 40px 24px; overflow-y: auto;
        }
        .scene.active { opacity: 1; pointer-events: auto; z-index: 10; }
        .scene-inner { max-width: 420px; text-align: center; width: 100%; }

        /* ===== HEALING BAR ===== */
        .healing-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 5px; background: rgba(255,255,255,0.08);
            z-index: 100; opacity: 0; transition: opacity 1s ease;
        }
        .healing-bar.visible { opacity: 1; }
        .healing-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #7c3aed, #a855f7, #fbbf24);
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 3px 3px 0;
        }

        /* ===== CHAPTER TITLE ===== */
        .chapter-overlay {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0a0a14; z-index: 200;
            opacity: 0; pointer-events: none;
            transition: opacity 1s ease;
        }
        .chapter-overlay.visible { opacity: 1; }
        .chapter-num {
            font-family: 'Noto Serif KR', serif;
            font-size: 0.8rem; color: #5a4a7a;
            letter-spacing: 0.3em; margin-bottom: 12px;
        }
        .chapter-title {
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            color: #8a7aaa; font-weight: 700;
        }
        .chapter-inner { text-align: center; }

        /* ===== BUTTONS ===== */
        .btn {
            font-family: 'Noto Sans KR', sans-serif;
            border: none; cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            color: #e8e0f0; padding: 14px 40px;
            border-radius: 30px; font-size: 1rem;
            font-weight: 700; letter-spacing: 0.05em;
            box-shadow: 0 4px 20px rgba(124,58,237,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(124,58,237,0.5); }
        .btn-primary:active { transform: translateY(0); }
        .btn-text {
            background: none; color: #a090c0;
            font-size: 0.95rem; padding: 10px 20px;
        }
        .btn-text:hover { color: #c0b0e0; }
        .btn-golden {
            background: linear-gradient(135deg, #92400e, #d97706, #fbbf24);
            color: #1a0a00; padding: 14px 40px;
            border-radius: 30px; font-size: 1rem; font-weight: 700;
            box-shadow: 0 4px 20px rgba(251,191,36,0.3);
        }
        .btn-golden:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(251,191,36,0.5); }
        .btn-warm {
            background: linear-gradient(135deg, #78350f, #b45309);
            color: #fde68a; padding: 14px 40px;
            border-radius: 30px; font-size: 1rem; font-weight: 700;
            box-shadow: 0 4px 20px rgba(180,83,9,0.3);
        }

        /* ===== INTRO ===== */
        #scene-intro { background: radial-gradient(ellipse at 50% 100%, #0f0f1e, #0a0a14); padding: 0; }
        .rain-container { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .raindrop {
            position: absolute; width: 1px;
            background: linear-gradient(transparent, rgba(160,180,220,0.4));
            animation: rain-fall linear infinite;
        }
        @keyframes rain-fall { 0% { transform: translateY(-10vh); } 100% { transform: translateY(110vh); } }
        .intro-content { text-align: center; z-index: 2; padding: 20px; }
        .intro-title {
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900; letter-spacing: 0.05em;
            line-height: 1.3; margin-bottom: 16px; color: #c8c0d8;
            text-shadow: 0 2px 20px rgba(124,58,237,0.3);
        }
        .intro-subtitle { font-size: 0.9rem; color: #8080a0; margin-bottom: 48px; font-weight: 300; }

        /* ===== TYPED TEXT ===== */
        .typed-text {
            font-size: 1.05rem; line-height: 2.2;
            color: #c8c0d8; font-weight: 300;
            white-space: pre-wrap; text-align: center;
        }
        .typed-text.typing::after {
            content: '│'; color: #a855f7;
            animation: blink 1s step-end infinite; margin-left: 1px;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .story-text-area { min-height: 80px; margin-bottom: 24px; }
        .btn-next-area { min-height: 50px; }

        /* ===== GENERIC STORY SCENES ===== */
        .story-scene { background: #0a0a14; }
        .character-area { width: 80px; height: 100px; margin: 0 auto 32px; position: relative; }
        .silhouette {
            width: 50px; height: 80px; margin: 0 auto;
            background: radial-gradient(ellipse at 50% 30%, #1a1a2e, #0f0f18);
            border-radius: 25px 25px 15px 15px; position: relative;
        }
        .silhouette-head {
            width: 30px; height: 30px; background: #1a1a2e;
            border-radius: 50%; position: absolute;
            top: -18px; left: 50%; transform: translateX(-50%);
        }

        /* ===== RAIN WALK SCENE ===== */
        #scene-rain { background: #080a14; }
        #scene-rain .rain-container { z-index: 0; }

        /* ===== NARRATIVE OVERLAY ===== */
        .narrative-overlay {
            position: fixed; inset: 0;
            background: rgba(8,8,18,0.97);
            display: flex; align-items: center; justify-content: center;
            z-index: 150; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease; padding: 40px 24px;
        }
        .narrative-overlay.active { opacity: 1; pointer-events: auto; }
        .narrative-content { max-width: 420px; text-align: center; }

        /* ===== MACHINE SCENE ===== */
        #scene-machine {
            background: linear-gradient(180deg, #0a0a14, #0f0a1a);
            padding: 20px; justify-content: flex-start; padding-top: 28px;
        }
        .machine-scene-layout {
            display: flex; flex-direction: column;
            align-items: center; width: 100%;
            max-width: 420px; gap: 12px;
        }
        .draw-counter { font-size: 0.8rem; color: #8080a0; letter-spacing: 0.1em; }

        /* === VENDING MACHINE === */
        .machine-container {
            position: relative; width: 200px; margin: 0 auto;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .machine-container.shrunk { opacity: 0; transform: scale(0.5); pointer-events: none; height: 0; overflow: hidden; }
        .machine-top-cap {
            width: 170px; height: 18px;
            background: linear-gradient(180deg, #6b5b8a, #4a3d6b);
            border-radius: 10px 10px 0 0; margin: 0 auto;
            position: relative; z-index: 2;
        }
        .machine-dome {
            width: 160px; height: 120px; margin: 0 auto;
            position: relative;
            background: rgba(200,190,220,0.07);
            border-left: 4px solid #5a4a7a;
            border-right: 4px solid #5a4a7a;
            overflow: hidden;
        }
        .machine-dome::before {
            content: ''; position: absolute;
            top: 8px; left: 8px; width: 35px; height: 50px;
            background: rgba(255,255,255,0.04);
            border-radius: 18px; transform: rotate(-15deg);
        }
        .dome-ball {
            position: absolute; width: 20px; height: 20px; border-radius: 50%;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .dome-ball.drawn { opacity: 0; transform: scale(0.3); }
        .machine-mid {
            width: 180px; height: 20px;
            background: linear-gradient(180deg, #5a4a7a, #4a3d6b);
            margin: 0 auto; position: relative; z-index: 2;
        }
        .machine-body {
            width: 180px; height: 130px;
            background: linear-gradient(180deg, #4a3d6b, #3a2d5a);
            margin: 0 auto; position: relative;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .coin-slot-area {
            position: absolute; top: 14px; left: 50%;
            transform: translateX(-50%); text-align: center;
        }
        .coin-slot {
            width: 32px; height: 4px; background: #1a1028;
            border: 2px solid #7a6a9a; border-radius: 3px;
            margin: 0 auto; position: relative;
        }
        .coin-label { font-size: 0.5rem; color: #7a6a9a; margin-top: 3px; }
        .coin {
            position: absolute; width: 20px; height: 20px;
            background: radial-gradient(circle at 35% 35%, #fbbf24, #b45309);
            border-radius: 50%; border: 2px solid #fcd34d;
            z-index: 10; opacity: 0;
            left: 50%; transform: translateX(-50%);
        }
        .coin.dropping { animation: coin-drop 0.8s ease-in forwards; }
        .coin.dropping-slow { animation: coin-drop-slow 1.4s ease-in forwards; }
        @keyframes coin-drop {
            0% { opacity: 1; top: -40px; }
            70% { opacity: 1; top: -2px; }
            85% { opacity: 1; top: -2px; transform: translateX(-50%) scale(0.7); }
            100% { opacity: 0; top: -2px; transform: translateX(-50%) scale(0); }
        }
        @keyframes coin-drop-slow {
            0% { opacity: 1; top: -50px; }
            50% { opacity: 1; top: -20px; }
            80% { opacity: 1; top: -2px; }
            90% { opacity: 1; top: -2px; transform: translateX(-50%) scale(0.8); }
            100% { opacity: 0; top: -2px; transform: translateX(-50%) scale(0); }
        }
        .handle-area {
            position: absolute; right: -28px; top: 45px;
            cursor: pointer; z-index: 5;
        }
        .handle-base {
            width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid #7a6a9a; background: #3a2d5a; position: relative;
        }
        .handle-grip {
            width: 10px; height: 10px; background: #a090c0;
            border-radius: 50%; position: absolute;
            top: -6px; left: 50%; transform: translateX(-50%);
            transition: all 0.3s;
        }
        .handle-area.ready .handle-grip {
            background: #fbbf24;
            box-shadow: 0 0 10px rgba(251,191,36,0.5);
        }
        .handle-area.turning { animation: handle-turn 0.8s ease-in-out; }
        .handle-area.turning-slow { animation: handle-turn-slow 1.5s ease-in-out; }
        @keyframes handle-turn { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        @keyframes handle-turn-slow { 0% { transform: rotate(0); } 100% { transform: rotate(720deg); } }
        .dispense-area { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); }
        .dispense-slot {
            width: 64px; height: 40px; background: #0a0814;
            border: 3px solid #6a5a8a; border-radius: 5px;
        }
        .machine-container.shaking { animation: shake 0.5s ease-in-out; }
        .machine-container.shaking-long { animation: shake-long 1s ease-in-out; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-3px); } 40% { transform: translateX(3px); }
            60% { transform: translateX(-2px); } 80% { transform: translateX(2px); }
        }
        @keyframes shake-long {
            0%,100% { transform: translateX(0); }
            10% { transform: translateX(-3px); } 20% { transform: translateX(3px); }
            30% { transform: translateX(-4px); } 40% { transform: translateX(4px); }
            50% { transform: translateX(-3px); } 60% { transform: translateX(3px); }
            70% { transform: translateX(-2px); } 80% { transform: translateX(2px); }
            90% { transform: translateX(-1px); }
        }

        /* === CAPSULE === */
        .capsule-wrap { text-align: center; }
        .capsule-result { width: 50px; height: 66px; margin: 0 auto; cursor: pointer; opacity: 0; }
        .capsule-result.appear { animation: capsule-appear 0.6s ease-out forwards; }
        @keyframes capsule-appear {
            0% { opacity: 0; transform: translateY(-20px); }
            60% { opacity: 1; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .capsule-top-half { width: 50px; height: 30px; border-radius: 25px 25px 3px 3px; transition: transform 0.5s ease, opacity 0.5s ease; }
        .capsule-bottom-half { width: 50px; height: 30px; border-radius: 3px 3px 25px 25px; filter: brightness(0.65); }
        .capsule-seam { width: 50px; height: 2px; background: rgba(0,0,0,0.2); margin: -1px 0; position: relative; z-index: 1; }
        .capsule-result.open .capsule-top-half { transform: translateY(-18px); opacity: 0; }

        /* === ITEM REVEAL === */
        .item-reveal-area {
            text-align: center; opacity: 0; transform: translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .item-reveal-area.visible { opacity: 1; transform: translateY(0); }
        .item-icon { width: 64px; height: 64px; margin: 8px auto; position: relative; }
        .item-glow {
            position: absolute; inset: -12px; border-radius: 50%;
            background: radial-gradient(circle, rgba(251,191,36,0.2), transparent);
            animation: glow-pulse 2s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%,100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .item-name {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.1rem; color: #e8d8f8;
            margin-bottom: 12px; font-weight: 700;
        }
        .item-story-text {
            font-size: 0.92rem; line-height: 2.2; color: #b8b0c8;
            font-weight: 300; min-height: 60px; white-space: pre-wrap;
        }
        .item-story-text.typing::after { content: '│'; color: #a855f7; animation: blink 1s step-end infinite; }
        .action-area { min-height: 56px; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
        .instruction-text { font-size: 0.85rem; color: #8080a0; text-align: center; animation: fade-in 0.5s ease; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        /* ===== ENDING ===== */
        #scene-ending { background: radial-gradient(ellipse at 50% 60%, #1a0d2e, #0a0a14); }
        .ending-content { max-width: 420px; text-align: center; position: relative; }
        .ending-speech {
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(2rem, 10vw, 3.5rem); color: #fbbf24;
            text-shadow: 0 0 40px rgba(251,191,36,0.4);
            margin: 24px 0; font-weight: 700;
            opacity: 0; transition: opacity 2s ease;
        }
        .ending-speech.visible { opacity: 1; }
        .ending-final-text {
            font-size: 0.95rem; line-height: 2.2; color: #c8c0d8;
            font-weight: 300; margin-bottom: 20px; white-space: pre-wrap;
        }
        .ending-final-text.typing::after { content: '│'; color: #fbbf24; animation: blink 1s step-end infinite; }

        /* ===== EPILOGUE ===== */
        #scene-epilogue {
            background: radial-gradient(ellipse at 60% 0%, #2a1a08 0%, #1a1408 30%, #0a0a14 100%);
        }
        #scene-epilogue::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 60% -10%, rgba(251,191,36,0.08), transparent 60%);
            pointer-events: none;
        }
        .epilogue-content { max-width: 420px; text-align: center; position: relative; }
        .epilogue-speech {
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(1.5rem, 7vw, 2.2rem); color: #fbbf24;
            text-shadow: 0 0 30px rgba(251,191,36,0.3);
            margin: 24px 0; font-weight: 700;
            opacity: 0; transition: opacity 2s ease;
        }
        .epilogue-speech.visible { opacity: 1; }

        /* ===== ITEMS COLLECTED ===== */
        .collected-items {
            display: flex; gap: 14px; justify-content: center;
            flex-wrap: wrap; margin: 20px 0; opacity: 0;
            transition: opacity 1s ease;
        }
        .collected-items.visible { opacity: 1; }
        .collected-item {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            animation: float-item 3s ease-in-out infinite;
        }
        .collected-item:nth-child(2) { animation-delay: 0.4s; }
        .collected-item:nth-child(3) { animation-delay: 0.8s; }
        .collected-item:nth-child(4) { animation-delay: 1.2s; }
        .collected-item:nth-child(5) { animation-delay: 1.6s; }
        .collected-item:nth-child(6) { animation-delay: 2.0s; }
        .collected-item:nth-child(7) { animation-delay: 2.4s; }
        @keyframes float-item {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .collected-item .css-button,
        .collected-item .css-hanky,
        .collected-item .css-receipt,
        .collected-item .css-star { width: 24px; height: 24px; }
        .collected-item .css-key { width: 14px; height: 28px; }
        .collected-item .css-candy { width: 30px; height: 14px; margin: 0; }
        .collected-item .css-brushes { height: 30px; gap: 5px; }
        .collected-item .css-brush { width: 4px; height: 24px; }

        /* ===== EFFECTS ===== */
        .sparkle {
            position: absolute; width: 3px; height: 3px;
            background: #fbbf24; border-radius: 50%;
            animation: sparkle-float 3s ease-in-out infinite;
        }
        @keyframes sparkle-float {
            0%,100% { opacity: 0; transform: translateY(0) scale(0); }
            50% { opacity: 0.8; transform: translateY(-30px) scale(1); }
        }
        .warm-pulse {
            position: fixed; inset: 0;
            background: radial-gradient(circle, rgba(251,191,36,0.12), transparent);
            z-index: 50; pointer-events: none;
            animation: warm-flash 1.2s ease-out forwards;
        }
        @keyframes warm-flash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
        .tear {
            position: absolute; width: 4px; height: 8px;
            background: linear-gradient(transparent, rgba(160,180,220,0.5));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: tear-fall 2s ease-in forwards;
        }
        @keyframes tear-fall {
            0% { opacity: 0; transform: translateY(0); }
            10% { opacity: 1; }
            100% { opacity: 0; transform: translateY(80px); }
        }
        .hidden { display: none !important; }

        /* ===== CSS ITEMS ===== */
        .css-button {
            width: 40px; height: 40px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #c0a080, #8b6f47);
            border: 3px solid #705a3a; position: relative; margin: 0 auto;
        }
        .css-button::before, .css-button::after {
            content: ''; position: absolute;
            width: 5px; height: 5px; border-radius: 50%; background: #3a2a1a;
        }
        .css-button::before { top: 10px; left: 9px; box-shadow: 12px 0 0 #3a2a1a; }
        .css-button::after { top: 20px; left: 9px; box-shadow: 12px 0 0 #3a2a1a; }
        .css-hanky {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #e8e0f0, #c8c0d8);
            border: 2px solid #a8a0b8; border-radius: 3px;
            position: relative; margin: 0 auto; transform: rotate(5deg);
        }
        .css-hanky::after {
            content: ''; position: absolute; bottom: 3px; right: 3px;
            width: 8px; height: 8px;
            border-bottom: 2px solid #9888b8; border-right: 2px solid #9888b8;
        }
        .css-candy { width: 44px; height: 20px; position: relative; margin: 10px auto; }
        .css-candy-body {
            width: 22px; height: 22px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff6b9d, #c0445a);
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        }
        .css-candy::before, .css-candy::after {
            content: ''; position: absolute; top: 3px;
            width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent;
        }
        .css-candy::before { left: 0; border-right: 10px solid rgba(255,180,200,0.5); }
        .css-candy::after { right: 0; border-left: 10px solid rgba(255,180,200,0.5); }
        .css-receipt {
            width: 28px; height: 42px; background: #f0ead8;
            position: relative; margin: 0 auto; border-radius: 2px;
        }
        .css-receipt::before {
            content: ''; position: absolute;
            top: 7px; left: 5px; right: 5px; height: 2px; background: #c8c0a8;
            box-shadow: 0 6px 0 #c8c0a8, 0 12px 0 #c8c0a8, 0 18px 0 #d8a0a0;
        }
        .css-key { width: 22px; height: 44px; position: relative; margin: 0 auto; }
        .css-key-ring { width: 18px; height: 18px; border: 4px solid #c0a060; border-radius: 50%; margin: 0 auto; }
        .css-key-shaft { width: 4px; height: 18px; background: #c0a060; margin: -2px auto 0; position: relative; }
        .css-key-tooth { position: absolute; bottom: 2px; left: 4px; width: 8px; height: 3px; background: #c0a060; box-shadow: 0 -7px 0 #c0a060; }
        .css-star {
            width: 40px; height: 40px; margin: 0 auto; background: #fbbf24;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        .css-brushes { display: flex; gap: 10px; justify-content: center; align-items: flex-end; height: 48px; }
        .css-brush { width: 7px; height: 38px; border-radius: 3px; position: relative; }
        .css-brush::before {
            content: ''; position: absolute; top: -5px;
            left: -2px; width: 11px; height: 8px;
            background: inherit; filter: brightness(1.4);
            border-radius: 3px 3px 1px 1px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-height: 680px) {
            .machine-container { transform: scale(0.8); transform-origin: top center; }

    {left:18,top:16},{left:60,top:12},{left:102,top:18},
    {left:30,top:50},{left:72,top:46},
    {left:14,top:80},{left:56,top:78}
];

var CHAPTERS = [
    ['하나', '소리 없는 아침'],
    ['둘', '교실'],
    ['셋', '빗속'],
    ['넷', '골목'],
    ['다섯', '뽑기 기계'],
    ['여섯', '목소리'],
    ['일곱', '해가 뜨다']
];

// ======================== STATE ========================
var state = { scene:'INTRO', drawIndex:0, healing:0, typing:false, typingTimer:null };
var currentSceneId = 'scene-intro';

// ======================== HELPERS ========================
var $ = function(id) { return document.getElementById(id); };
var wait = function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); };

function typeText(el, lines, speed) {
    speed = speed || 45;
    return new Promise(function(resolve) {
        var text = Array.isArray(lines) ? lines.join('\n') : lines;
        var i = 0;
        state.typing = true;
        el.textContent = '';
        el.classList.add('typing');
        if (state.typingTimer) clearInterval(state.typingTimer);
        var finish = function() {
            if (state.typingTimer) { clearInterval(state.typingTimer); state.typingTimer = null; }
            el.textContent = text;
            el.classList.remove('typing');
            state.typing = false;
            el.removeEventListener('click', onSkip);
            resolve();
        };
        var onSkip = function() { if (state.typing) finish(); };
        el.addEventListener('click', onSkip);
        state.typingTimer = setInterval(function() {
            if (i < text.length) { el.textContent = text.substring(0, ++i); }
            else { finish(); }
        }, speed);
    });
}

function switchScene(fromId, toId) {
    return new Promise(function(resolve) {
        $(fromId).classList.remove('active');
        currentSceneId = toId;
        setTimeout(function() {
            $(toId).classList.add('active');
            setTimeout(resolve, 600);
        }, 700);
    });
}

function showChapter(index) {
    return new Promise(function(resolve) {
        $('chapterNum').textContent = CHAPTERS[index][0];
        $('chapterTitle').textContent = CHAPTERS[index][1];
        $('chapterOverlay').classList.add('visible');
        setTimeout(function() {
            $('chapterOverlay').classList.remove('visible');
            setTimeout(resolve, 800);
        }, 2200);
    });
}

function showNarrative(lines, speed) {
    return new Promise(function(resolve) {
        $('narrativeText').textContent = '';
        $('btnNarrative').classList.add('hidden');
        $('narrativeOverlay').classList.add('active');
        wait(500).then(function() {
            return typeText($('narrativeText'), lines, speed || 50);
        }).then(function() {
            return wait(400);
        }).then(function() {
            $('btnNarrative').classList.remove('hidden');
            $('btnNarrative').addEventListener('click', function handler() {
                $('btnNarrative').removeEventListener('click', handler);
                $('narrativeOverlay').classList.remove('active');
                setTimeout(resolve, 600);
            });
        });
    });
}

function updateGrayscale() {
    document.body.style.filter = 'grayscale(' + Math.max(0, 100 - state.healing) + '%)';
}
function updateHealingBar() {
    $('healingFill').style.width = state.healing + '%';
}
function createWarmPulse() {
    var p = document.createElement('div');
    p.className = 'warm-pulse';
    document.body.appendChild(p);
    setTimeout(function() { p.remove(); }, 1400);
}
function createTears(container, count) {
    for (var i = 0; i < (count||5); i++) {
        var t = document.createElement('div');
        t.className = 'tear';
        t.style.left = (40 + Math.random() * 20) + '%';
        t.style.top = (30 + Math.random() * 10) + '%';
        t.style.animationDelay = (Math.random() * 1.5) + 's';
        container.appendChild(t);
    }
}

// ======================== RAIN ========================
function createRain(container, count) {
    for (var i = 0; i < (count||70); i++) {
        var d = document.createElement('div');
        d.className = 'raindrop';
        d.style.left = (Math.random()*100)+'%';
        d.style.height = (Math.random()*16+8)+'px';
        d.style.animationDuration = (Math.random()*0.7+0.4)+'s';
        d.style.animationDelay = (Math.random()*2)+'s';
        d.style.opacity = Math.random()*0.25+0.1;
        container.appendChild(d);
    }
}
function createDomeBalls() {
    var dome = $('machineDome');
    DOME_POSITIONS.forEach(function(pos, i) {
        var b = document.createElement('div');
        b.className = 'dome-ball'; b.dataset.index = i;
        b.style.left = pos.left+'px'; b.style.top = pos.top+'px';
        b.style.background = 'radial-gradient(circle at 35% 35%,'+ITEMS[i].capsuleColor+','+ITEMS[i].capsuleColor+'88)';
        dome.appendChild(b);
    });
}
function createSparkles(container, count) {
    for (var i = 0; i < (count||15); i++) {
        var s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = (Math.random()*100)+'%';
        s.style.top = (Math.random()*100)+'%';
        s.style.animationDelay = (Math.random()*3)+'s';
        s.style.animationDuration = (2+Math.random()*2)+'s';
        var sz = 2+Math.random()*4;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        container.appendChild(s);
    }
}

// ======================== GAME FLOW ========================

function initIntro() {
    createRain($('rainContainer'), 70);
    $('btnStart').addEventListener('click', startGame, { once: true });
}

async function startGame() {
    // Chapter 1: Prologue
    await showChapter(0);
    await switchScene('scene-intro', 'scene-prologue');
    await wait(600);
    await typeText($('prologueText'), PROLOGUE_1, 60);
    await wait(1000);
    await typeText($('prologueText'), PROLOGUE_2, 55);
    await wait(500);
    $('btnPrologueNext').classList.remove('hidden');
    await waitClick('btnPrologueNext');

    // Chapter 2: School
    await showChapter(1);
    await switchScene('scene-prologue', 'scene-school');
    await wait(600);
    await typeText($('schoolText'), SCHOOL_LINES, 50);
    await wait(500);
    $('btnSchoolNext').classList.remove('hidden');
    await waitClick('btnSchoolNext');

    // Chapter 3: Rain
    await showChapter(2);
    createRain($('rainContainer2'), 80);
    await switchScene('scene-school', 'scene-rain');
    await wait(600);
    await typeText($('rainText'), RAIN_LINES, 50);
    await wait(500);
    $('btnRainNext').classList.remove('hidden');
    await waitClick('btnRainNext');

    // Chapter 4: Alley + Boy
    await showChapter(3);
    await switchScene('scene-rain', 'scene-alley');
    await wait(600);
    await typeText($('alleyText'), ALLEY_LINES, 48);
    await wait(500);
    $('btnAlleyNext').classList.remove('hidden');
    await waitClick('btnAlleyNext');

    await switchScene('scene-alley', 'scene-boy');
    await wait(600);
    await typeText($('boyText'), BOY_LINES, 50);
    await wait(500);
    $('btnBoyNext').classList.remove('hidden');
    await waitClick('btnBoyNext');

    // Chapter 5: Machine
    await showChapter(4);
    goToMachine();
}

function waitClick(btnId) {
    return new Promise(function(resolve) {
        $(btnId).addEventListener('click', resolve, { once: true });
    });
}

// ======================== MACHINE ========================

async function goToMachine() {
    state.scene = 'MACHINE';
    $('healingBar').classList.add('visible');
    createDomeBalls();
    updateDrawCounter();
    await switchScene('scene-boy', 'scene-machine');
    await wait(300);
    showCoinButton();
}

function updateDrawCounter() {
    $('drawCounter').textContent = (state.drawIndex + 1) + ' / 7';
}

function showCoinButton() {
    var isLast = (state.drawIndex === 6);
    if (isLast) {
        $('actionArea').innerHTML = '<button class="btn btn-warm" id="btnCoin">떨리는 손으로 동전을 넣다</button>';
    } else {
        $('actionArea').innerHTML = '<button class="btn btn-primary" id="btnCoin">500원 넣기</button>';
    }
    $('btnCoin').addEventListener('click', doCoinInsert, { once: true });
}

async function doCoinInsert() {
    var isLast = (state.drawIndex === 6);
    $('actionArea').innerHTML = '<p class="instruction-text">' + (isLast ? '...딸깍' : '딸깍...') + '</p>';
    var coin = $('coin');
    coin.className = isLast ? 'coin dropping-slow' : 'coin dropping';
    await wait(isLast ? 1500 : 900);
    coin.className = 'coin';

    $('actionArea').innerHTML = '<p class="instruction-text">손잡이를 돌려보세요</p>';
    $('handleArea').classList.add('ready');
    $('handleArea').addEventListener('click', doHandleTurn, { once: true });
}

async function doHandleTurn() {
    var isLast = (state.drawIndex === 6);
    $('handleArea').classList.remove('ready');
    $('handleArea').classList.add(isLast ? 'turning-slow' : 'turning');
    $('actionArea').innerHTML = '';
    await wait(isLast ? 600 : 300);
    $('machineContainer').classList.add(isLast ? 'shaking-long' : 'shaking');

    var ball = $('machineDome').querySelector('[data-index="'+state.drawIndex+'"]');
    if (ball) ball.classList.add('drawn');

    await wait(isLast ? 1100 : 600);
    $('machineContainer').classList.remove('shaking', 'shaking-long');
    $('handleArea').classList.remove('turning', 'turning-slow');
    showCapsule();
}

function showCapsule() {
    var item = ITEMS[state.drawIndex];
    $('capsuleWrap').classList.remove('hidden');
    $('capsuleTop').style.background = item.capsuleColor;
    $('capsuleBottom').style.background = item.capsuleColor;
    $('capsuleResult').className = 'capsule-result appear';
    $('actionArea').innerHTML = '<p class="instruction-text">캡슐을 열어보세요</p>';
    $('capsuleResult').addEventListener('click', openCapsule, { once: true });
}

async function openCapsule() {
    var item = ITEMS[state.drawIndex];
    $('capsuleResult').classList.add('open');
    $('actionArea').innerHTML = '';
    await wait(600);

    $('capsuleWrap').classList.add('hidden');
    $('machineContainer').classList.add('shrunk');

    var reveal = $('itemReveal');
    reveal.classList.remove('hidden');
    $('itemIcon').innerHTML = '<div class="item-glow"></div>' + item.icon;
    $('itemName').textContent = item.name;
    $('itemStory').textContent = '';
    await wait(100);
    reveal.classList.add('visible');
    await wait(300);
    await typeText($('itemStory'), item.story, 40);
    await wait(400);

    $('actionArea').innerHTML = '<button class="btn btn-golden" id="btnKeep">마음에 담기</button>';
    $('btnKeep').addEventListener('click', keepItem, { once: true });
}

async function keepItem() {
    var item = ITEMS[state.drawIndex];
    createWarmPulse();
    state.healing = Math.min(100, state.healing + item.healing);
    updateGrayscale();
    updateHealingBar();
    await wait(1500);

    var idx = state.drawIndex;
    state.drawIndex++;

    if (state.drawIndex >= 7) {
        // Last item → ending
        goToEnding();
    } else if (idx < BETWEEN_DRAWS.length) {
        // Show between-draw narrative
        await showNarrative(BETWEEN_DRAWS[idx], 48);

        // Special: before last draw, show the last-draw intro
        if (state.drawIndex === 6) {
            await showNarrative(LAST_DRAW_INTRO, 50);
        }

        resetForNextDraw();
    } else {
        resetForNextDraw();
    }
}

function resetForNextDraw() {
    updateDrawCounter();
    $('capsuleResult').className = 'capsule-result';
    $('itemReveal').classList.add('hidden');
    $('itemReveal').classList.remove('visible');
    $('machineContainer').classList.remove('shrunk');
    showCoinButton();
}

// ======================== ENDING ========================

async function goToEnding() {
    state.scene = 'ENDING';
    await showChapter(5);
    await switchScene('scene-machine', 'scene-ending');
    $('healingBar').classList.remove('visible');

    createSparkles($('scene-ending').querySelector('.ending-content'), 20);

    await wait(800);
    await typeText($('endingNarration'), ENDING_1, 65);
    await wait(1500);

    // Second wave of narration
    await typeText($('endingNarration'), ENDING_2, 60);
    createTears($('scene-ending').querySelector('.ending-content'), 6);
    await wait(1500);

    // Third wave - the buildup
    await typeText($('endingNarration'), ENDING_3, 70);
    await wait(2000);

    // The moment
    $('endingSpeech').classList.add('visible');
    await wait(3000);

    // Final narration
    $('endingAfter').classList.remove('hidden');
    await typeText($('endingFinal'), ENDING_FINAL, 55);
    await wait(2000);

    goToEpilogue();
}

// ======================== EPILOGUE ========================

async function goToEpilogue() {
    state.scene = 'EPILOGUE';
    await showChapter(6);
    await switchScene('scene-ending', 'scene-epilogue');

    createSparkles($('scene-epilogue').querySelector('.epilogue-content'), 12);

    await wait(800);
    await typeText($('epilogueText'), EPILOGUE_1, 55);
    await wait(1500);

    await typeText($('epilogueText'), EPILOGUE_2, 50);

    // Show collected items floating
    var itemsHtml = '';
    ITEMS.forEach(function(item) {
        itemsHtml += '<div class="collected-item">' + item.icon + '</div>';
    });
    $('collectedItems').innerHTML = itemsHtml;

    await wait(800);

    await typeText($('epilogueText'), EPILOGUE_3, 55);
    await wait(1500);

    // The final word
    $('epilogueSpeech').classList.add('visible');
    await wait(3000);

    // Show final message + restart
    $('epilogueAfter').classList.remove('hidden');
    $('collectedItems').classList.add('visible');
    await wait(500);
    await typeText($('epilogueFinal'), EPILOGUE_FINAL, 55);

    $('btnRestart').addEventListener('click', function() { location.reload(); });
}

// ======================== INIT ========================
initIntro();
</script>
